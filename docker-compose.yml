services:
  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: MyMz
      APP_ENV: development
      DATABASE_URL: sqlite:///../data/app.db
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"
